<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="brand">
      <div class="brand__mark">A</div>
      <div class="brand__text">
        <div class="brand__title">ART<span class="brand__slash">/</span>FEED</div>
        <div class="brand__sub">v1.0 · public domain</div>
      </div>
    </header>

    <div class="status" id="status">
      <span class="status-dot"></span>
      <span class="status-text" id="status-text">Checking&hellip;</span>
    </div>

    <label class="toggle-row">
      <div class="toggle-row__text">
        <div class="toggle-row__label">FEED ACTIVE</div>
        <div class="toggle-row__sub">Replaces your LinkedIn feed</div>
      </div>
      <span class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </span>
    </label>

    <div class="api-key-section">
      <div class="api-key-head">
        <label class="api-key-label" for="gemini-key">GEMINI KEY</label>
        <span class="api-key-status" id="key-status"></span>
      </div>
      <div class="api-key-row">
        <input type="password" id="gemini-key" placeholder="Paste your free API key" />
        <button id="save-key" class="save-key-btn">Save</button>
      </div>
      <p class="api-key-hint">
        Free from <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>
        &mdash; enables &ldquo;Explain&rdquo; on artworks
      </p>
    </div>

    <p class="description">
      Replaces your LinkedIn feed with public-domain masterworks
      from The Met and the Art Institute of Chicago.
    </p>

    <footer>
      <a href="https://metmuseum.github.io/" target="_blank">MET API</a>
      <span class="sep">·</span>
      <a href="https://api.artic.edu/docs/" target="_blank">AIC API</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
